<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Vicky Pay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <section id="auth" class="auth">
    <div class="brand">
      <div class="logo">V</div>
      <h1>Vicky Pay</h1>
      <p>Simple. Secure. Yours.</p>
    </div>

    <div id="message" class="message"></div>

    <div class="auth-card">
      <div class="tabs">
        <button id="loginTab" class="tab active" onclick="showLogin()">Login</button>
        <button id="registerTab" class="tab" onclick="showRegister()">Create account</button>
      </div>

      <form id="loginForm">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required>

        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>

        <button id="loginButton" class="primary" type="submit">Login</button>
      </form>

      <form id="registerForm" class="hidden">
        <label>Full name</label>
        <input id="registerName" type="text" autocomplete="name" required>

        <label>Email</label>
        <input id="registerEmail" type="email" autocomplete="email" required>

        <label>Password</label>
        <input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required>

        <label>Currency</label>
        <select id="registerCurrency">
          <option value="NGN">NGN</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="XOF">XOF</option>
        </select>

        <button id="registerButton" class="primary" type="submit">Create account</button>
      </form>
    </div>
  </section>

  <section id="dashboard" class="dashboard hidden">

    <header class="topbar">
      <div>
        <small>Welcome back</small>
        <strong id="userName">Vicky Pay</strong>
      </div>
      <button class="icon-button" onclick="logout()">↪</button>
    </header>

    <main>

      <section class="balance-card">
        <div class="balance-label">Available balance</div>
        <div class="balance-row">
          <strong id="balance">0.00</strong>
          <button onclick="toggleBalance()">◉</button>
        </div>
        <span id="currency">NGN</span>
      </section>

      <div id="dashboardMessage" class="message"></div>

      <section class="actions">
        <button onclick="openMoney('deposit')">
          <span>＋</span>
          <b>Add money</b>
        </button>

        <button onclick="openMoney('transfer')">
          <span>↗</span>
          <b>Send money</b>
        </button>

        <button onclick="openMoney('withdraw')">
          <span>↓</span>
          <b>Withdraw</b>
        </button>

        <button onclick="loadTransactions(true)">
          <span>≡</span>
          <b>History</b>
        </button>
      </section>

      <section class="quick">
        <h3>Quick actions</h3>
        <div class="quick-grid">
          <button>Airtime</button>
          <button>Data</button>
          <button>Electricity</button>
          <button>Bills</button>
        </div>
      </section>

      <section class="transactions">
        <div class="section-head">
          <h3>Recent transactions</h3>
          <button onclick="loadTransactions(true)">See all</button>
        </div>
        <div id="transactionsList"></div>
      </section>

      <section class="profile-card">
        <h3>Account</h3>
        <p id="profileEmail"></p>
        <button onclick="loadAccounts()">Connected accounts</button>
        <button onclick="loadReferrals()">Referrals</button>
      </section>

    </main>
  </section>

  <div id="moneyModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeMoney()">×</button>

      <h2 id="moneyTitle">Add money</h2>

      <div id="depositPanel">
        <label>Amount</label>
        <input id="depositAmount" type="number" min="0.01" step="0.01" placeholder="0.00">

        <label>Payment method</label>
        <select id="depositMethod">
          <option value="card">Credit / Debit Card</option>
          <option value="bank">Bank</option>
          <option value="wallet">Mobile Wallet</option>
        </select>

        <label>Description</label>
        <input id="depositDescription" placeholder="Optional">

        <button class="primary" onclick="deposit()">Continue</button>
      </div>

      <div id="transferPanel" class="hidden">
        <label>Recipient</label>
        <input id="transferRecipient" placeholder="Email or account ID">

        <label>Amount</label>
        <input id="transferAmount" type="number" min="0.01" step="0.01" placeholder="0.00">

        <label>Description</label>
        <input id="transferDescription" placeholder="Optional">

        <button class="primary" onclick="transfer()">Send money</button>
      </div>

      <div id="withdrawPanel" class="hidden">
        <label>Amount</label>
        <input id="withdrawAmount" type="number" min="0.01" step="0.01" placeholder="0.00">

        <label>Withdrawal account</label>
        <select id="withdrawAccount">
          <option value="">Choose account</option>
        </select>

        <button class="primary" onclick="withdraw()">Withdraw</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="active">⌂<span>Home</span></button>
    <button onclick="openMoney('deposit')">＋<span>Add</span></button>
    <button onclick="openMoney('transfer')">↗<span>Send</span></button>
    <button onclick="loadTransactions(true)">≡<span>History</span></button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
